name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'visualizer/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'visualizer/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run DTC Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: "ci-secret-key-dtc-testing-only-1234567890"
      INTERNAL_SERVICE_KEY: "dtc-internal-coordinator-secret-key-2026"
      STAFF_API_KEY: "dtc-staff-secret-key-2026"
      ADMIN_DOMAIN: "dtc.internal"
      PUBLIC_BASE_URL: "http://127.0.0.1:8002"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      REDIS_URL: "redis://127.0.0.1:6379/0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            */requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --prefer-binary

      - name: Check for uncommitted migrations
        run: |
          echo "Checking migration status across services..."
          python coordinator-service/manage.py makemigrations --check --dry-run
          python inventory-service/manage.py makemigrations --check --dry-run
          python payment-service/manage.py makemigrations --check --dry-run

      - name: Run Coordinator Service Tests (59 tests)
        run: |
          python coordinator-service/manage.py test coordinator --noinput

      - name: Run Inventory Service Tests (21 tests)
        run: |
          python inventory-service/manage.py test inventory --noinput

      - name: Run Payment Service Tests (10 tests)
        run: |
          python payment-service/manage.py test payments --noinput
