<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const E=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.append(e);return e};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,BY=88,D=36,GAP=22,rnd=n=>Math.random()*n;
const SV=[['coord','Coordinator',':8002'],['inv','Inventory',':8000'],['pay','Payment',':8001'],['rec','Recovery Worker','']].map((a,i)=>({k:a[0],n:a[1],p:a[2],i,st:'up',sag:0,brk:0,tsag:0,tbrk:0}));
const bk=$('#back'),fr=$('#front');let W=940,H=200,time=0,tok=0;
const log=t=>{const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+'  '+t;$('#log').prepend(d);while($('#log').children.length>40)$('#log').lastChild.remove()};
// ---------- DOM: pills + panel
SV.forEach(s=>{const d=document.createElement('div');d.className='pill'+(s.k=='rec'?' rec':'');d.setAttribute('role','status');d.innerHTML=`<i></i><b>${s.n}</b><span>${s.p}</span><em>—</em>`;$('#pills').append(d);s.el=d;s.lat=d.querySelector('em')});
SV.slice(0,3).forEach(s=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<b>${s.n} <small style="display:inline">${s.p}</small></b><span>${['up','slow','down'].map(x=>`<button data-k="${s.k}" data-s="${x}" class="${x=='up'?'on':''}">${{up:'Healthy',slow:'Slow',down:'Down'}[x]}</button>`).join(' ')}</span>`;$('#svc').append(r)});
document.querySelectorAll('#svc button').forEach(b=>b.onclick=()=>setSt(SV.findIndex(s=>s.k==b.dataset.k),b.dataset.s));
// ---------- branch drawing
E('defs',{},bk).innerHTML='<linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3683a"/><stop offset=".5" stop-color="#7a4a2a"/><stop offset="1" stop-color="#4b2b17"/></linearGradient>';
SV.forEach(s=>{s.g=E('g',{},bk);s.rope=E('path',{fill:'none',stroke:'#b89a6a','stroke-width':2,'stroke-linecap':'round'},s.g);
s.pc=[0,1].map(()=>({b:E('path',{stroke:'url(#wg)','stroke-width':24,fill:'none','stroke-linecap':'round'},s.g),t:E('path',{stroke:'#2b160a','stroke-width':24,fill:'none','stroke-dasharray':'2 11',opacity:.28},s.g),h:E('path',{stroke:'#e0a86a','stroke-width':3,fill:'none','stroke-linecap':'round',opacity:.35,transform:'translate(0 -6)'},s.g)}));
s.lv=[.14,.42,.7,.9].map(t=>{const g=E('g',{},s.g);E('path',{d:'M0 0Q-9-10-3-24Q7-14 0 0Z',fill:'#5fbf55',transform:'rotate(-30)'},g);E('path',{d:'M0 0Q-9-10-3-22Q7-14 0 0Z',fill:'#4aa84a',transform:'rotate(28)'},g);return{g,t}})});
function layout(){
  const w=$('#wrap');W=w.clientWidth;H=w.clientHeight;
  [bk,fr].forEach(v=>v.setAttribute('viewBox',`0 0 ${W} ${H}`));
  const po=$('#pills').offsetLeft,r=SV.map(s=>({l:s.el.offsetLeft+po,r:s.el.offsetLeft+po+s.el.offsetWidth}));
  SV.forEach((s,i)=>{
    s.xm=(r[i].l+r[i].r)/2;
    // Branch spans cleanly from edge to edge of the stage
    s.x0=i ? (r[i-1].r+r[i].l)/2 : 0;
    s.x1=i<3 ? (r[i].r+r[i+1].l)/2 : W;
  });
}
const piece=(s,side)=>{const g=GAP*s.brk,dr=D*s.brk,sg=26*s.sag-4*(1-s.sag)*(1-s.brk);return side?{xa:s.xm+g,ya:BY+dr,xb:s.x1,yb:BY,cy:BY+dr/2+sg}:{xa:s.x0,ya:BY,xb:s.xm-g,yb:BY+dr,cy:BY+dr/2+sg}};
const qy=(p,x)=>{const t=Math.max(0,Math.min(1,(x-p.xa)/(p.xb-p.xa)));return(1-t)*(1-t)*p.ya+2*(1-t)*t*p.cy+t*t*p.yb};
const surf=x=>{const s=SV.find(s=>x>=s.x0&&x<=s.x1);if(!s)return null;if(s.brk>.5&&Math.abs(x-s.xm)<GAP*s.brk+2)return null;return qy(piece(s,x>s.xm?1:0),x)};
function drawSeg(s){[0,1].forEach(sd=>{const p=piece(s,sd),d=`M${p.xa} ${p.ya}Q${(p.xa+p.xb)/2} ${p.cy} ${p.xb} ${p.yb}`,o=s.pc[sd];o.b.setAttribute('d',d);o.t.setAttribute('d',d);o.h.setAttribute('d',d)});
s.lv.forEach((l,j)=>{const x=s.x0+(s.x1-s.x0)*l.t;l.g.setAttribute('transform',`translate(${x} ${(surf(x)??BY)-10}) rotate(${RM?0:Math.sin(time*(s.sag>.5?7:1.6)+j*2)*(s.sag>.5?7:4)})`);l.g.style.opacity=Math.max(0,1-s.brk*1.6)});
const ry=BY+D*s.brk+13*s.sag+8,pt=126;s.rope.setAttribute('d',`M${s.xm-26} ${pt}L${s.xm} ${ry}L${s.xm+26} ${pt}`);s.rope.style.opacity=Math.max(0,1-s.brk*3)}
// ---------- monkey (rigged)
const MO=[];
function mk(sc=1){
  const c='#7a4a2a',f='#f0cf9b',root=E('g',{},fr),inn=E('g',{},root),
        m={root,inn,sc,x:0,y:0,tx:null,pose:'idle',mode:'stand',speed:110,dir:1,rot:0,spin:0,amp:0,vx:0,
           say:'',sayT:0,banana:false,q:false,ground:false,
           hangK:0,swingPhase:0,hx:0,followHang:false};
  const st={stroke:c,'stroke-linecap':'round',fill:'none'};
  m.tail=E('g',{},inn);E('path',{...st,d:'M0 0Q-18 4-15-14Q-13-24-5-21','stroke-width':4},m.tail);
  const limb=(len,paw)=>{const g=E('g',{},inn);E('line',{x1:0,y1:0,x2:0,y2:len,...st,'stroke-width':5},g);E('circle',{cx:0,cy:len,r:3.2,fill:paw?f:c},g);return g};
  m.ll=limb(13);m.rl=limb(13);E('ellipse',{cx:0,cy:-24,rx:10,ry:13,fill:c},inn);E('ellipse',{cx:1,cy:-22,rx:6,ry:8,fill:f},inn);
  m.la=limb(24,1);m.ra=limb(24,1);m.ban=E('path',{d:'M-2 0Q4-10 12-8Q8 0-2 0Z',fill:'#ffd84a',stroke:'#b8901a','stroke-width':1,transform:'translate(0 24)'},m.ra);
  m.hd=E('g',{},inn);E('circle',{r:10,fill:c},m.hd);[-10,10].forEach(x=>{E('circle',{cx:x,cy:-1,r:3.6,fill:c},m.hd);E('circle',{cx:x,cy:-1,r:1.8,fill:f},m.hd)});E('ellipse',{cy:3,rx:7,ry:6,fill:f},m.hd);[-3,3].forEach(x=>E('circle',{cx:x,cy:0,r:1.7,fill:'#1a0f08'},m.hd));E('path',{d:'M-3 5Q0 8 3 5',...st,stroke:'#5a2f14','stroke-width':1.2},m.hd);
  m.band=E('rect',{x:-10,y:-9,width:20,height:4,rx:2,display:'none'},m.hd);m.sw=E('path',{d:'M0 0Q-4 6 0 8Q4 6 0 0Z',fill:'#5cc8ff',transform:'translate(13 -50)'},inn);
  m.bub=E('text',{'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#fff',stroke:'#0a120f','stroke-width':3,'paint-order':'stroke','font-family':'Bricolage Grotesque,sans-serif'},fr);
  m.speak=(t,ms)=>{m.say=t;m.sayT=time+ms/1000};MO.push(m);return m;
}
const M=mk(),T=(x,y,r)=>`translate(${x} ${y}) rotate(${r})`;
function lims(m){if(m.ground)return[24,W-24];let lo=SV[0].x0+12,hi=SV[3].x1-12;for(const s of SV.slice(0,3))if(s.brk>.5){const w=GAP*s.brk+8;if(m.x<s.xm)hi=Math.min(hi,s.xm-w);else lo=Math.max(lo,s.xm+w)}return[lo,hi]}

// Buttery-smooth swing pose & limb kinematics
function poseOf(m,t){
  const o={la:6,ra:6,ll:0,rl:0,tl:Math.sin(t*2)*10,bob:Math.sin(t*2.4)*.6,hd:0},sl=m.slow?.5:1;
  const sw=Math.sin(m.swingPhase||0);
  switch(m.pose){
    case'walk':{const p=t*9*sl*m.speed/110;o.ll=Math.sin(p)*34;o.rl=-o.ll;o.la=-o.ll*.8;o.ra=-o.rl*.8;o.bob=-Math.abs(Math.sin(p))*2.5;o.tl=Math.sin(p)*18;break}
    case'sit':o.ll=o.rl=-78;o.bob=-8;o.la=o.ra=-25;break;
    case'scratch':o.ra=146+Math.sin(t*20)*14;o.hd=Math.sin(t*20)*4;break;
    case'wave':o.ra=-145+Math.sin(t*10)*22;break;
    case'eat':o.ra=155+Math.sin(t*9)*6;o.hd=Math.sin(t*9)*3;break;
    case'hang':{
      const brach = Math.abs(m.vx||0) > 8 ? Math.sin((m.swingPhase||0)*1.8)*18 : 0;
      o.la = 180 + brach - (m.rot||0)*0.25;
      o.ra = 180 - brach + (m.rot||0)*0.25;
      o.ll = sw * 14 - (m.rot||0)*0.45;
      o.rl = -sw * 14 + (m.rot||0)*0.45;
      o.tl = -(m.rot||0)*0.7 + Math.sin(t*3)*8;
      break;
    }
    case'hangOne':{
      o.ra = 180;
      o.la = 140 + Math.sin(t*5)*10 - (m.rot||0)*0.35;
      o.ll = sw * 12 - (m.rot||0)*0.4;
      o.rl = -sw * 12 + (m.rot||0)*0.4;
      o.hd = Math.sin(t*4)*5;
      o.tl = -(m.rot||0)*0.6;
      break;
    }
    case'confuse':o.ra=146+Math.sin(t*20)*12;o.hd=Math.sin(t*6)*9;break;
    case'cele':o.bob=Math.abs(Math.sin(t*9))*12;o.la=143+Math.sin(t*12)*15;o.ra=-143-Math.sin(t*12)*15;break;
    case'reach':{
      o.ra = 180;
      o.la = m.ra_ || (140 + Math.sin(t*6)*10);
      o.ll = sw * 10 - (m.rot||0)*0.35;
      o.rl = -sw * 10 + (m.rot||0)*0.35;
      o.tl = -(m.rot||0)*0.5;
      break;
    }
    case'no':o.hd=Math.sin(t*18)*15;break;
    case'shock':o.la=130;o.ra=-130;o.hd=Math.sin(t*40)*4;o.bob=Math.sin(t*30);break;
    case'bonk':o.la=o.ra=150;o.bob=Math.abs(Math.sin(t*14))*8;break;
  }
  return o;
}

function upd(m,dt){
  if(m.pend&&m.pend.my!==tok){m.pend.rej('x');m.pend=null;m.tx=null}
  m.slow=SV.some(s=>m.x>=s.x0&&m.x<=s.x1&&s.st==='slow')&&m.mode==='stand'&&!m.ground;
  
  if(m===M&&m.follow&&m.mode==='stand'&&ptr.active)m.tx=ptr.x;
  
  if(m.mode==='stand'&&m.tx!=null){
    const l=lims(m),tx=Math.max(l[0],Math.min(l[1],m.tx)),d=tx-m.x;
    if(Math.abs(d)<2){
      m.x=tx;const ok=Math.abs(m.tx-tx)<3;m.tx=null;m.pose='idle';m.pend&&m.pend.res(ok);m.pend=null;
    }else{
      m.dir=d>0?1:-1;
      const step = Math.sign(d)*Math.min(Math.abs(d),m.speed*(m.slow?.45:1)*dt);
      m.x+=step;
      m.pose='walk';
    }
  }

  // 60FPS Buttery-smooth horizontal guide when hanging under branch
  if(m.mode==='hang'&&m.followHang&&ptr.active){
    const l=lims({x:m.hx,ground:false});
    const targetX=Math.min(Math.max(ptr.x,l[0]),l[1]);
    const diff=targetX-m.hx;
    const moveStep=Math.sign(diff)*Math.min(Math.abs(diff),170*dt);
    m.hx+=moveStep;
    m.vx=moveStep/dt;
    if(Math.abs(diff)>3){
      m.dir=diff>0?1:-1;
      m.pose='hang';
    }else{
      m.vx*=.85;
      m.pose='reach';
    }
  }

  if(m.pose==='bonk'){m.x+=m.vx*dt;m.vx*=.95;m.spin+=540*dt*Math.min(1,Math.abs(m.vx)/60)}
  
  // Continuous smooth transition between stand and hang (no 50px teleports!)
  const targetHangK = (m.mode==='hang') ? 1 : 0;
  m.hangK += (targetHangK - m.hangK) * Math.min(1, dt * 8);

  const sc=m.sc;let px,py,rot=0,hoff=0;

  if(m.mode==='hang'||m.hangK>0.01){
    const pv = m.pv ? m.pv() : [m.x, (surf(m.x)??BY)+11];
    px = pv[0];
    m.x = px;
    
    // Smooth harmonic swing integration (starts at phase=0, no snap)
    m.swingPhase = (m.swingPhase || 0) + dt * 2.5;
    const targetAmp = (RM ? 0 : m.pose==='hang' ? 24 : m.pose==='hangOne' ? 18 : m.pose==='reach' ? 14 : 10);
    m.amp += (targetAmp - m.amp) * Math.min(1, dt * 3);
    
    // Inertia from horizontal motion creates natural fluid swing
    const inertiaAngle = -Math.min(22, Math.max(-22, (m.vx || 0) * 0.16));
    rot = (Math.sin(m.swingPhase) * m.amp + inertiaAngle) * m.hangK;
    
    if(m.pose==='reach'){
      m.dir=ptr.x>px?1:-1;
      m.ra_=Math.atan2(-(ptr.x-px)*m.dir, ptr.y - pv[1] - 24*sc)*57.3;
    }

    // Smoothly lower below branch (hoff 0 -> 56*sc)
    hoff = 56 * sc * m.hangK;
    const standY = (surf(px) ?? BY) - 11;
    const hangAnchorY = pv[1];
    py = standY + (hangAnchorY - standY) * m.hangK;
    m.y = py + hoff;
  }
  else{
    if(m.mode==='stand'){
      const sy=surf(m.x);
      if(m.ground)m.y+=(H-4-m.y)*Math.min(1,dt*4);
      else if(sy!=null){
        m.y+=(sy-11-m.y)*Math.min(1,dt*14);
        rot=Math.atan2((surf(m.x+8)??sy)-(surf(m.x-8)??sy),16)*57.3;
      }else{
        const s=SV.find(s=>m.x>=s.x0&&m.x<=s.x1);
        if(s)m.x+=(m.x>=s.xm?1:-1)*90*dt;
      }
    }
    px=m.x;py=m.y;
  }

  const o=poseOf(m,time);
  if(m.mode!=='hang') py -= o.bob;
  m.rot = rot;

  m.root.setAttribute('transform',T(px,py,rot));
  m.inn.setAttribute('transform',`translate(0 ${hoff}) translate(0 -28) rotate(${m.spin}) translate(0 28) scale(${m.dir*sc} ${sc})`);
  m.la.setAttribute('transform',T(-8,-32,o.la));m.ra.setAttribute('transform',T(8,-32,o.ra));
  m.ll.setAttribute('transform',T(-5,-12,o.ll));m.rl.setAttribute('transform',T(5,-12,o.rl));
  m.tail.setAttribute('transform',T(-8,-16,o.tl));m.hd.setAttribute('transform',T(0,-44,o.hd));
  m.ban.setAttribute('display',m.banana?'':'none');
  m.sw.setAttribute('display',(m.slow||m.pose==='shock'||m.sad)?'':'none');
  const say=time<m.sayT?m.say:m.q?'?':'';m.bub.textContent=say;
  m.bub.setAttribute('transform',`translate(${m.x} ${m.mode==='hang'?py-12:m.y-72*sc})`);
}

// ---------- director
const sleep=(ms,my)=>new Promise((r,j)=>setTimeout(()=>my===tok?r():j('x'),ms));
const tween=(ms,fn,my)=>new Promise((res,rej)=>{const t0=performance.now(),st=n=>{if(my!==tok)return rej('x');const k=Math.min(1,(n-t0)/ms);fn(k);k<1?requestAnimationFrame(st):res()};requestAnimationFrame(st)});
async function play(fn){const my=++tok;wp.mode='perch';hs=null;M.follow=false;M.followHang=false;try{await fn(my)}catch(e){if(e!=='x')throw e}}
const go=fn=>play(async my=>{await fn(my);if(my!==tok)return;await idle(my)});
const goStand=(m,x,my)=>{m.mode='stand';m.followHang=false;return new Promise((res,rej)=>{m.tx=x;m.pend={res,rej,my}})};
const pose=async(m,p,ms,my)=>{m.pose=p;await sleep(ms,my);m.pose='idle'};

async function hang(m,pv,ms,p,my,land){
  m.pv=pv;
  m.mode='hang';
  m.pose=p;
  m.amp=0;
  m.swingPhase=0;
  await sleep(ms,my);
  m.x=pv()[0]+(land||0);
  m.mode='stand';
  m.pose='idle';
  m.spin=0;
}
const tip=s=>()=>[s.xm-GAP*s.brk,BY+D*s.brk+10];
async function stuck(m,my){const s=SV.slice(0,3).find(s=>s.brk>.5&&Math.abs(m.x-s.xm)<GAP+40);if(!s)return;m.dir=m.x<s.xm?1:-1;m.q=true;await pose(m,'confuse',2200,my);m.q=false;
if(m.x<s.xm){await goStand(m,s.xm-GAP-14,my);m.q=true;await hang(m,tip(s),2800,'hangOne',my,-18);m.q=false}}
async function idle(my){
  const m=M;
  while(my===tok){
    m.banana=false;m.q=false;const r=Math.random();
    if(RM){m.pose='sit';await sleep(2000,my);continue}
    if(ptr.active){await guideStep(m,my);continue}
    m.follow=false;m.followHang=false;
    if(r<.42){const l=lims(m);if(!await goStand(m,l[0]+rnd(l[1]-l[0]),my))await stuck(m,my)}
    else if(r<.55)await pose(m,'scratch',2000,my);
    else if(r<.65)await pose(m,'wave',1800,my);
    else if(r<.75){m.banana=true;await pose(m,'eat',2600,my);m.banana=false}
    else if(r<.85)await pose(m,'sit',2800,my);
    else{
      const s=SV[Math.floor(rnd(3))],x=s.x1;
      if(await goStand(m,x,my)&&surf(x)!=null)await hang(m,()=>[x,BY+11],3200,'hang',my);
    }
    await sleep(300+rnd(700),my);
  }
}
async function fall(m,s,my){m.tx=null;m.pend=null;m.mode='air';m.pose='shock';m.sad=false;const x0=m.x,y0=m.y,pv=tip(s),[px,py]=pv();
await tween(380,k=>{m.x=x0+(px-18*0-x0)*k;m.y=y0+(py+56-y0)*k*k},my);m.q=true;await hang(m,pv,3200,'hangOne',my,-18);m.q=false}
let hs=null;const ptr={x:0,y:0,t:-99,in:false,get active(){return this.in&&time-this.t<5}},hook={x:0,y:0};
const rope=E('path',{fill:'none',stroke:'#c9a56b','stroke-width':3,'stroke-linecap':'round','stroke-dasharray':'7 3'},fr),hookC=E('circle',{r:6,fill:'#c9a56b',stroke:'#5b4426','stroke-width':2},fr);
$('#wrap').addEventListener('pointermove',e=>{const r=$('#wrap').getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.in=true;ptr.t=time});
$('#wrap').addEventListener('pointerleave',()=>ptr.in=false);$('#help').onclick=()=>{if(hs==='ask')hs='rope'};
function drawRope(){const on=hs==='rope'||hs==='climb';if(on){const ax=hs==='rope'?ptr.x:hook.x,ay=hs==='rope'?ptr.y:hook.y,sx=M.x,sy=M.y-46,yy=(sy+ay)/2+Math.min(50,Math.hypot(ax-sx,ay-sy)*.25);rope.setAttribute('d',`M${sx} ${sy}Q${(sx+ax)/2} ${yy} ${ax} ${ay}`);hookC.setAttribute('cx',ax);hookC.setAttribute('cy',ay)}
rope.style.display=hookC.style.display=on?'':'none';SV[3].el.style.boxShadow=hs==='rope'?'0 0 0 3px var(--vio)':'';const h=$('#help');h.hidden=hs!=='ask';h.style.left=(M.x-64)+'px';h.style.top=(M.y-110)+'px'}
async function allDown(my){const m=M;m.tx=null;m.pend=null;m.mode='stand';m.ground=true;m.q=false;m.pose='shock';log('All services down: the monkey has nowhere to stand');await sleep(1000,my);await goStand(m,SV[1].x1,my);m.pose='sit';m.sad=true;hs='ask';log('Monkey asks the client for help');
while(hs==='ask')await sleep(100,my);
m.speak('pull me up! →',60000);log('Help accepted: drag the rope to the Recovery Worker branch');
while(!(ptr.x>=SV[3].x0&&ptr.x<=SV[3].x1&&ptr.y>BY-46&&ptr.y<BY+24))await sleep(60,my);
hook.x=Math.min(Math.max(ptr.x,SV[3].x0+40),SV[3].x1-70);hook.y=BY-12;hs='climb';m.sayT=0;const x0=m.x,y0=m.y;m.mode='air';m.ground=false;m.sad=false;m.pose='hang';m.dir=hook.x>x0?1:-1;
await tween(700,k=>{m.x=x0;m.y=y0+(BY-40-y0)*k},my);await tween(1300,k=>{m.x=x0+(hook.x-x0)*k;m.y=BY-40+(hook.y-BY+40)*k-Math.sin(k*Math.PI)*18},my);
hs=null;m.mode='stand';m.pose='sit';m.x=hook.x;m.y=BY-11;log('Monkey is safe on the Recovery Worker branch');m.speak('phew',2000);while(true)await sleep(3000,my)}
async function runTo(s,my){const m=M;hs=null;m.follow=false;m.q=false;m.sad=false;m.tx=null;m.pend=null;m.speed=210;log(`${s.n} is back online: monkey runs there`);
try{if(m.ground){const bx=Math.abs(m.x-s.x0)<Math.abs(m.x-s.x1)?s.x0+16:s.x1-16;m.mode='stand';await goStand(m,bx,my);m.ground=false;await sleep(500,my)}m.mode='stand';
await goStand(m,s.xm,my);m.speak('online!',1200);m.pose='sit';await sleep(4000,my);m.pose='idle'}finally{m.speed=110}}
async function repair(s,my){log(`Woodpecker refreshes ${s.n} only`);await flyWp(s.xm,BY-50,900,my);wp.mode='peck';wp.dir=1;await sleep(1600,my);setSt(s.i,'up','refreshed by woodpecker',1);await flyWp(W-50,BY-25,800,my);wp.mode='perch'}

// Buttery-smooth guideStep with hysteresis and continuous tracking
async function guideStep(m,my){
  const x=ptr.x, y=ptr.y, s=SV.find(s=>x>=s.x0&&x<=s.x1);

  // Smooth hysteresis: enter hang below BY+20, exit hang above BY-6
  if(y > BY + 20){
    if(m.mode !== 'hang'){
      m.follow = false;
      const l = lims(m);
      const startX = Math.min(Math.max(x, l[0]), l[1]);
      await goStand(m, startX, my);
      if(surf(m.x) == null) return;
      m.hx = m.x;
      m.pv = () => [m.hx, (surf(m.hx) ?? BY) + 11];
      m.mode = 'hang';
      m.pose = 'reach';
      m.amp = 0;
      m.swingPhase = 0;
    }
    m.followHang = true;
    await sleep(40, my);
    return;
  }

  // Smoothly climb back up to stand on top of branch
  if(m.mode === 'hang' && y < BY - 6){
    m.followHang = false;
    m.x = m.hx;
    m.mode = 'stand';
    m.pose = 'idle';
    await sleep(200, my);
    return;
  }

  if(m.mode === 'hang'){
    await sleep(50, my);
    return;
  }

  if(s&&s.i<3&&s.st==='down'){
    m.follow=false;await goStand(m,x,my);m.dir=x>m.x?1:-1;m.q=true;await pose(m,'no',1500,my);m.q=false;
    if(s.st==='down'){m.speak('woodpecker!',1200);await repair(s,my);await runTo(s,my)}
    return;
  }
  
  m.follow=true;m.mode='stand';await sleep(200,my);
  if(Math.abs(m.x-ptr.x)<8&&m.tx==null){
    const a=['eat','sit','scratch','wave'][Math.floor(rnd(4))];
    m.follow=false;m.banana=a==='eat';await pose(m,a,1400+rnd(1200),my);m.banana=false;
  }
}

// ---------- woodpecker + falling leaves
const wp={x:0,y:0,dir:-1,mode:'perch',g:E('g',{},fr),tx:E('text',{'font-size':11,'font-weight':700,fill:'#ffd23f',stroke:'#0a120f','stroke-width':3,'paint-order':'stroke'},fr)};
wp.g.innerHTML='<ellipse rx="9" ry="12" fill="#26303a"/><ellipse cx="3" cy="2" rx="5" ry="8" fill="#f4f1e8"/><path d="M-8-2Q-14 8-4 12Z" fill="#3a4b5c"/><path d="M-4 10L-10 22L2 14Z" fill="#111a22"/>';
wp.head=E('g',{},wp.g);wp.head.innerHTML='<circle r="6.5" fill="#26303a"/><circle cx="-1" cy="-5" r="3" fill="#e0463c"/><path d="M-8-2Q0-12 8-2Z" fill="#ffd23f"/><rect x="-9" y="-3" width="18" height="2" rx="1" fill="#e0b400"/><path d="M5-1L16 1 5 3Z" fill="#f59e0b"/><circle cx="2" cy="-.5" r="1.7" fill="#fff"/><circle cx="2.4" cy="-.5" r=".8" fill="#111"/>';
const flyWp=(x,y,ms,my)=>{const x0=wp.x,y0=wp.y;wp.mode='fly';wp.dir=x>x0?1:-1;return tween(ms,k=>{wp.x=x0+(x-x0)*k;wp.y=y0+(y-y0)*k-Math.sin(k*Math.PI)*24},my)};
function wpUpd(){if(wp.mode==='perch'){wp.x=W-50;wp.y=BY-25;wp.dir=-1}const pk=wp.mode==='peck';
wp.head.setAttribute('transform',T(5,-13,pk?Math.sin(time*32)*20-8:Math.sin(time*2)*4));wp.g.setAttribute('transform',`translate(${wp.x} ${wp.y+(wp.mode==='fly'?Math.sin(time*30)*1.5:0)}) scale(${wp.dir} 1)`);
wp.tx.textContent=pk&&Math.sin(time*32)>0?'tap':'';wp.tx.setAttribute('transform',`translate(${wp.x+wp.dir*14} ${wp.y-10})`)}
const LV=[];let nextLeaf=2;
function leaves(dt){if(RM)return;nextLeaf-=dt;if(nextLeaf<0){nextLeaf=3+rnd(3);const s=SV[Math.floor(rnd(3))];if(s.st==='up')LV.push({x:s.x0+rnd(s.x1-s.x0),y:BY-12,r:rnd(360),e:E('path',{d:'M0 0Q-6-6-2-14Q5-7 0 0Z',fill:'#5fbf55'},fr)})}
for(let i=LV.length-1;i>=0;i--){const l=LV[i];l.y+=24*dt;l.x+=Math.sin(l.y/9)*20*dt;l.r+=90*dt;l.e.setAttribute('transform',T(l.x,l.y,l.r));if(l.y>H){l.e.remove();LV.splice(i,1)}}}
// ---------- state
function setSt(i,st,why,q){const s=SV[i],prev=s.st;s.st=st;s.tsag=st==='slow'?1:0;s.tbrk=st==='down'?1:0;s.el.classList.remove('slow','down');st!=='up'&&s.el.classList.add(st);
s.lv.forEach(l=>l.g.querySelector('path').setAttribute('fill',st==='slow'?'#c9a53a':'#5fbf55'));
document.querySelectorAll(`[data-k="${s.k}"]`).forEach(b=>b.classList.toggle('on',b.dataset.s===st));
s.el.title=s.el.ariaLabel=`${s.n}: ${st==='down'?'unreachable':st==='slow'?'slow (>800 ms)':'healthy'}`;s.lat.textContent=st==='down'?'DOWN':'…';
log(`${s.n} → ${st.toUpperCase()}${why?' · '+why:''}`);tick();
if(st==='down'){for(const m of MO)if(m.mode==='stand'&&!m.ground&&Math.abs(m.x-s.xm)<GAP+26&&m===M)go(my=>fall(m,s,my))}
if(SV.slice(0,3).every(x=>x.st==='down'))go(allDown);else if(prev==='down'&&st==='up'&&!q)go(my=>runTo(s,my))}
function tick(){SV.slice(0,3).forEach(s=>{s.lat.textContent=s.st==='down'?'DOWN':(s.st==='slow'?860+~~rnd(140):110+~~rnd(110))+' ms'})}
setInterval(tick,1200);let rc=87;
setInterval(()=>{rc--;if(rc<1){rc=90;if(SV.slice(0,3).some(s=>s.st!=='up')){log('Heartbeat: sweep triggered');go(recover)}}SV[3].lat.textContent=rc+'s'},1000);
function resetAll(){MO.slice(1).forEach(m=>{m.root.remove();m.bub.remove()});MO.length=1;SV.slice(0,3).forEach((s,i)=>{if(s.st!=='up')setSt(i,'up',null,1)});M.speed=110;M.ground=false;M.sad=false;M.mode='stand';M.pose='idle';M.spin=0;M.vx=0;M.q=false;M.banana=false}
async function recover(my){const b=SV.slice(0,3).filter(s=>s.st!=='up');if(!b.length){log('Sweep: nothing to repair');return}
log('Recovery worker sweeping…');M.tx=null;M.pend=null;if(M.mode!=='stand'){M.mode='stand'}M.q=false;M.sad=false;M.ground=false;M.pose='idle';
for(const s of b){await flyWp(s.xm,BY-50,900,my);wp.mode='peck';wp.dir=1;await sleep(1600,my);setSt(s.i,'up','repaired by sweep',1)}
await flyWp(W-50,BY-25,900,my);wp.mode='perch';M.pose='cele';M.say='fixed!';M.sayT=time+2;await tween(700,k=>M.spin=k*360,my);M.spin=0;await sleep(1000,my)}
const S={
happy:async my=>{resetAll();log('Saga: happy path');for(const s of SV.slice(0,3)){await goStand(M,s.xm,my);if(s.i===1)M.banana=true;M.speak(['hold ✓','reserve ✓','charge ✓'][s.i],1200);await sleep(1100,my)}
M.banana=false;M.pose='cele';M.speak('committed!',1800);log('Saga COMPLETED');await sleep(2200,my)},
decl:async my=>{resetAll();log('Saga: payment decline');await goStand(M,SV[1].xm,my);M.banana=true;M.speak('reserved',900);await sleep(900,my);await goStand(M,SV[2].xm-70,my);M.speak('charge?',900);await sleep(900,my);
setSt(2,'down','HTTP 422 insufficient funds');await pose(M,'shock',1400,my);M.speak('compensate!',1200);await goStand(M,SV[1].xm,my);M.banana=false;M.speak('released ✓',1400);log('Compensation: seat back to AVAILABLE');await sleep(1200,my);setSt(2,'up','recovered',1);await sleep(800,my)},
race:async my=>{resetAll();log('Race: 5 concurrent holds on one seat');const inv=SV[1],cols=['#ffd84a','#5cc8ff','#b58cff','#ff5d4d','#6fd26a'],R=[M];for(let i=0;i<4;i++)R.push(mk(.8));
R.forEach((m,i)=>{m.band.setAttribute('fill',cols[i]);m.band.setAttribute('display','');m.mode='stand';m.x=SV[0].x0+24+i*26;m.y=BY-11;m.dir=1;m.speed=130+rnd(80);m.ground=false;m.tx=null});
const bn=E('path',{d:'M-8 0Q-2-12 10-9Q6 3-8 0Z',fill:'#ffd84a',stroke:'#b8901a','stroke-width':1.5,transform:`translate(${inv.xm} ${BY-14})`},fr);
try{const win=await Promise.race(R.map((m,i)=>goStand(m,inv.xm,my).then(()=>i)));R.forEach((m,i)=>{if(i!==win){m.tx=null;m.pend=null;m.pose='bonk';m.vx=-240;m.speak('409',1800)}});
bn.remove();const w=R[win];w.banana=true;w.pose='cele';w.speak('200 OK 👑',2600);log(`Monkey #${win+1} won the row lock (200). Others: 409 Conflict. No double booking.`);await sleep(2800,my)}finally{bn.remove()}
R.forEach(m=>{if(m!==M){m.root.remove();m.bub.remove()}});MO.length=1;M.band.setAttribute('display','none');M.mode='stand';M.spin=0;M.banana=false;M.x=Math.min(Math.max(M.x,SV[0].x0+20),SV[3].x1-20)},
crash:async my=>{resetAll();log('Fault injection: kill coordinator process');await goStand(M,SV[0].xm-40,my);await goStand(M,SV[0].xm,my);M.speak('working…',800);await sleep(700,my);setSt(0,'down','SIGKILL mid-flight')},
rec:recover};
Object.entries({happy:'s-happy',decl:'s-decl',race:'s-race',crash:'s-crash',rec:'s-rec'}).forEach(([k,id])=>$('#'+id).onclick=()=>go(S[k]));
$('#s-reset').onclick=()=>go(async()=>{resetAll();log('Reset: all healthy')});
// ---------- boot
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;time+=dt;SV.forEach(s=>{s.sag+=(s.tsag-s.sag)*Math.min(1,dt*4);s.brk+=(s.tbrk-s.brk)*Math.min(1,dt*(s.tbrk>s.brk?9:3));drawSeg(s)});MO.slice().forEach(m=>upd(m,dt));wpUpd();leaves(dt);drawRope();requestAnimationFrame(frame)}
new ResizeObserver(layout).observe($('#wrap'));document.fonts.ready.then(layout);layout();tick();SV[3].lat.textContent=rc+'s';
M.x=SV[0].xm;M.y=BY-11;go(async()=>{await sleep(300,tok)});requestAnimationFrame(frame);
</script></body></html>
